<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STRIKE PROTOCOL</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'Courier New', monospace;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #fff;
        user-select: none;
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        background:
          linear-gradient(#0f0, #0f0) center 0 / 2px 7px no-repeat,
          linear-gradient(#0f0, #0f0) center 100% / 2px 7px no-repeat,
          linear-gradient(#0f0, #0f0) 0 center / 7px 2px no-repeat,
          linear-gradient(#0f0, #0f0) 100% center / 7px 2px no-repeat;
        opacity: 0.9;
      }
      #lock-hint {
        position: absolute;
        left: 50%;
        top: 62%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(140, 200, 255, 0.5);
        border-radius: 4px;
        padding: 14px 22px;
        font-size: 15px;
        line-height: 1.7;
        text-align: center;
        letter-spacing: 0.06em;
      }
      #lock-hint .title {
        font-size: 17px;
        color: #ffd257;
        margin-bottom: 6px;
      }
      #status {
        position: absolute;
        left: 12px;
        top: 10px;
        font-size: 12px;
        line-height: 1.6;
        background: rgba(0, 0, 0, 0.45);
        padding: 8px 10px;
        border-radius: 3px;
        white-space: pre;
      }
      #keys {
        position: absolute;
        left: 12px;
        bottom: 10px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.75);
        background: rgba(0, 0, 0, 0.35);
        padding: 6px 9px;
        border-radius: 3px;
      }
      #weapon {
        position: absolute;
        right: 14px;
        bottom: 12px;
        font-size: 14px;
        letter-spacing: 0.04em;
        background: rgba(0, 0, 0, 0.45);
        padding: 7px 12px;
        border-radius: 3px;
      }
      #radar {
        position: absolute;
        right: 14px;
        top: 12px;
        background: rgba(8, 12, 16, 0.55);
        border: 1px solid rgba(140, 200, 255, 0.3);
        border-radius: 3px;
      }
      #blind {
        position: absolute;
        inset: 0;
        background: #ffffff;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.1s linear;
      }
      #hitmarker {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        opacity: 0;
        pointer-events: none;
      }
      #hitmarker::before,
      #hitmarker::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 26px;
        height: 2px;
        margin: -1px 0 0 -13px;
        background: currentColor;
      }
      #hitmarker::before {
        transform: rotate(45deg);
      }
      #hitmarker::after {
        transform: rotate(-45deg);
      }
      #dmg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        box-shadow: inset 0 0 120px 40px rgba(200, 0, 0, 0.7);
      }
      #round {
        position: absolute;
        left: 50%;
        top: 10px;
        transform: translateX(-50%);
        font-size: 13px;
        background: rgba(0, 0, 0, 0.45);
        padding: 6px 14px;
        border-radius: 3px;
        letter-spacing: 0.04em;
      }
      #roundmsg {
        position: absolute;
        left: 50%;
        top: 40%;
        transform: translateX(-50%);
        font-size: 22px;
        color: #ffd257;
        background: rgba(0, 0, 0, 0.55);
        padding: 14px 26px;
        border-radius: 4px;
        display: none;
        white-space: nowrap;
      }
      #buymenu {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 320px;
        background: rgba(10, 14, 18, 0.92);
        border: 1px solid rgba(140, 200, 255, 0.4);
        border-radius: 4px;
        padding: 14px;
        pointer-events: auto;
      }
      #buymenu .money {
        color: #ffd257;
        font-size: 16px;
        margin-bottom: 8px;
      }
      #buymenu {
        max-height: 70vh;
        overflow-y: auto;
      }
      .bm-section {
        color: #7fb0ff;
        font-size: 11px;
        letter-spacing: 0.1em;
        margin: 8px 0 4px;
        border-bottom: 1px solid rgba(140, 200, 255, 0.25);
        padding-bottom: 3px;
      }
      .buy-row {
        padding: 6px 8px;
        cursor: pointer;
        border-radius: 3px;
        font-size: 13px;
      }
      .buy-row:hover {
        background: rgba(140, 200, 255, 0.18);
      }
      #scoreboard {
        position: absolute;
        left: 50%;
        top: 8%;
        transform: translateX(-50%);
        background: rgba(10, 14, 18, 0.9);
        border: 1px solid rgba(140, 200, 255, 0.35);
        border-radius: 4px;
        padding: 10px 14px;
        min-width: 340px;
      }
      #scoreboard .sb-head {
        color: #ffd257;
        font-size: 14px;
        margin-bottom: 8px;
        letter-spacing: 0.05em;
      }
      #scoreboard table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      #scoreboard td {
        padding: 3px 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      #scoreboard tr.T td:first-child { color: #6fe07f; }
      #scoreboard tr.CT td:first-child { color: #7fb0ff; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="blind"></div>
      <div id="hitmarker"></div>
      <div id="dmg"></div>
      <div id="lock-hint">
        <div class="title">STRIKE PROTOCOL</div>
        点击画面锁定鼠标开始<br />
        WASD 移动 / 空格 跳跃(按住连跳) / Shift 静走 / Ctrl 蹲<br />
        鼠标左键 开火 / 右键 开镜(狙击) / R 换弹 / 1 主 · 2 副 · 3 刀 · 4-7 投掷物<br />
        B 买枪 / G 丢装备 / Tab 计分板 / E 安放·拆除 C4 / Esc 暂停
      </div>
      <div id="round"></div>
      <div id="roundmsg"></div>
      <canvas id="radar" width="180" height="180"></canvas>
      <div id="status"></div>
      <div id="keys">FPS <span id="fps">--</span> · TICK <span id="tick">0</span></div>
      <div id="weapon"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
