<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>STRIKE PROTOCOL · 手机</title>
    <link rel="stylesheet" href="/hud.css" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* 移动端：禁滚动/缩放/双击放大 */
      html,
      body {
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #rotate-hint {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0b0e13;
        color: #e8eef6;
        font-family: 'Courier New', monospace;
        text-align: center;
        padding: 24px;
      }
      #rotate-hint .rh-ico {
        font-size: 44px;
        color: #ffd257;
        animation: rhFlip 1.6s ease-in-out infinite;
      }
      @keyframes rhFlip {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(90deg);
        }
      }
      #rotate-hint .rh-txt {
        font-size: 16px;
        letter-spacing: 0.1em;
      }
      @media (orientation: portrait) and (max-width: 820px) {
        #rotate-hint {
          display: flex;
        }
      }
      /* 小屏压缩 HUD 字号，避免与按键重叠 */
      @media (max-height: 500px) {
        #status,
        #round {
          font-size: 10px;
        }
        #radar {
          transform: scale(0.7);
          transform-origin: top right;
        }
      }
    </style>
  </head>
  <body>
    <div id="rotate-hint">
      <div class="rh-ico">⟳</div>
      <div class="rh-txt">请横屏游玩<br />STRIKE PROTOCOL</div>
    </div>
    <canvas id="game"></canvas>
    <div id="loading">
      <div class="lg-logo">STRIKE PROTOCOL<span> · 手机</span></div>
      <div class="lg-bar"><div id="loading-bar"></div></div>
      <div id="loading-status">正在初始化…</div>
    </div>
    <div id="fatal">
      <div class="box">
        <h1>无法启动游戏</h1>
        <p id="fatal-msg"></p>
        <button id="fatal-retry" onclick="location.reload()">重 试</button>
      </div>
    </div>
    <div id="error-log"></div>
    <div id="hud">
      <div id="crosshair" data-style="cross">
        <i class="ch-t"></i><i class="ch-b"></i><i class="ch-l"></i><i class="ch-r"></i><i class="ch-d"></i><i class="ch-c"></i>
      </div>
      <div id="scope" data-mag="1"></div>
      <div id="blind"></div>
      <div id="hitmarker"></div>
      <div id="dmg"></div>
      <svg id="dmgdir" viewBox="0 0 140 140">
        <path id="dmgdir-a" d="M 35 35 A 42.4 42.4 0 0 1 105 35" />
        <path id="dmgdir-b" d="M 35 35 A 42.4 42.4 0 0 1 105 35" />
      </svg>
      <div id="killreward"></div>
      <div id="spectate"></div>
      <div id="radio"></div>
      <div id="killfeed"></div>
      <div id="toasts"></div>
      <div id="lock-hint">
        <div class="title">STRIKE PROTOCOL · 手机</div>
        左半屏摇杆移动 · 右半屏拖拽转向<br />
        开火/跳/蹲/换弹/E 安放 · 买/丢/切枪/投掷物见右侧按键<br />
        左上「II」暂停
      </div>
      <div id="round"></div>
      <div id="roundmsg"></div>
      <canvas id="radar" width="220" height="220"></canvas>
      <div id="status"></div>
      <div id="keys">FPS <span id="fps">--</span> · TICK <span id="tick">0</span></div>
      <div id="weapon"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
